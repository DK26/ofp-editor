[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
publish = false

# Debug info off: the harness compiles many tiny crates and links many test
# binaries; skipping debug info roughly halves link time on Windows.
[profile.dev]
debug = false

[profile.test]
debug = false
