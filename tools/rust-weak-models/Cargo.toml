# Research instrument (doc 64): PLAIN vs GUIDED Rust APIs for small coding models.
# Not product code. A standalone workspace: any Cargo workspace above this folder (a future
# repository-root Cargo.toml) must list it in `exclude` and must never name a crate below it
# as a member (see README, "Standalone workspace"; test_rwm.EnclosingWorkspace checks it).
#
# crates/*        shared spec, hidden core, the two API variants, the independent oracle
# tasks/*/plain   one test crate per (task, variant); the model writes src/solution.rs
# tasks/*/guided  (generated by `python runner.py scaffold`, git-ignored; do not hand-edit)
# pilot/*/...     pilot tasks, same shape, never scored
#
# No external dependencies, so `cargo --offline --locked` always works once scaffold has
# written the task crates and Cargo.lock.
# The toolchain is not pinned with rust-toolchain.toml on purpose: a pin that names a
# version rustup does not have installed under that exact name triggers a download,
# which the offline harness must never do. The runner records `rustc --version` in
# every record instead, and rust-version below rejects older compilers.

[workspace]
resolver = "3"
# The member list between the markers is rewritten by `python runner.py scaffold`.
members = [
    "crates/*",
    # BEGIN scaffold members
    "pilot/P01/plain",
    "pilot/P01/guided",
    "pilot/P02/plain",
    "pilot/P02/guided",
    "pilot/P03/plain",
    "pilot/P03/guided",
    "pilot/P04/plain",
    "pilot/P04/guided",
    "tasks/T01/plain",
    "tasks/T01/guided",
    "tasks/T02/plain",
    "tasks/T02/guided",
